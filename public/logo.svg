<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 80" fill="none">
  <defs>
    <linearGradient id="logoGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F5D089"/>
      <stop offset="50%" stop-color="#E5A84B"/>
      <stop offset="100%" stop-color="#BA7818"/>
    </linearGradient>
    <linearGradient id="logoBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3A2218"/>
      <stop offset="100%" stop-color="#23130C"/>
    </linearGradient>
  </defs>

  <!-- Crest Icon -->
  <g transform="translate(6, 6)">
    <circle cx="34" cy="34" r="33" fill="url(#logoBg)"/>
    <circle cx="34" cy="34" r="29.5" stroke="url(#logoGold)" stroke-width="1.2" stroke-dasharray="2.5 1.5"/>
    <circle cx="34" cy="34" r="27" stroke="url(#logoGold)" stroke-width="0.5" stroke-opacity="0.4"/>
    
    <!-- Cloche -->
    <circle cx="34" cy="22" r="2.2" fill="url(#logoGold)"/>
    <path d="M32.5 24 H35.5 V26 H32.5 Z" fill="url(#logoGold)"/>
    <path d="M21 38 C21 27, 47 27, 47 38 Z" fill="url(#logoGold)"/>
    <path d="M25 36 C26 30, 30.5 28.5, 34 28.5" stroke="#FFF6DE" stroke-width="1.3" stroke-linecap="round" fill="none"/>
    <rect x="18" y="39" width="32" height="3" rx="1.5" fill="url(#logoGold)"/>
    <path d="M16 44 Q34 45.5 52 44" stroke="url(#logoGold)" stroke-width="1.2" stroke-linecap="round"/>
    
    <!-- Sparkle on top -->
    <path d="M34 14.5 L34.7 16.5 L36.7 17.2 L34.7 17.9 L34 19.9 L33.3 17.9 L31.3 17.2 L33.3 16.5 Z" fill="#FFF6DE"/>
  </g>

  <!-- Typography -->
  <text x="88" y="32" font-family="'Playfair Display', Georgia, serif" font-size="11" font-weight="700" letter-spacing="4" fill="#C95D3B">TRAITEUR</text>
  <text x="88" y="58" font-family="'Playfair Display', Georgia, serif" font-size="28" font-weight="800" letter-spacing="0.5" fill="#2B1810">Toutou</text>
  <circle cx="218" cy="54" r="2.5" fill="#E5A84B"/>
  <text x="88" y="70" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="8.5" font-weight="600" letter-spacing="2" fill="#7A685D">MAISON GASTRONOMIQUE</text>
</svg>
