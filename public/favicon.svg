<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F5D089"/>
      <stop offset="50%" stop-color="#E5A84B"/>
      <stop offset="100%" stop-color="#BA7818"/>
    </linearGradient>
    <linearGradient id="darkBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3D2419"/>
      <stop offset="100%" stop-color="#23130C"/>
    </linearGradient>
  </defs>
  <!-- Background Badge -->
  <circle cx="32" cy="32" r="31" fill="url(#darkBg)"/>
  <circle cx="32" cy="32" r="27.5" stroke="url(#goldGrad)" stroke-width="1.2" stroke-dasharray="2.5 1.5"/>
  <circle cx="32" cy="32" r="25" stroke="url(#goldGrad)" stroke-width="0.5" stroke-opacity="0.4"/>
  
  <!-- Toque / Cloche Traiteur Icon -->
